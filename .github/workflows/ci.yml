name: TechScape CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-test-and-audit:
    name: Python Test & Audit (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Code Style & Hygiene Check (Ruff)
        run: |
          ruff check python/ tests/

      - name: Run Repository Claims & Portability Audit
        run: |
          python -m python.audit

      - name: Run Automated Python Tests (Pytest)
        run: |
          pytest tests/ -v --tb=short

  r-data-quality:
    name: R Data Quality & Ecosystem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install R Dependencies
        run: |
          Rscript R/install_dependencies.R

      - name: Run Testthat Quality Suite
        run: |
          Rscript tests/testthat.R

      - name: Execute Complete Master Ecosystem
        run: |
          Rscript R/13_run_complete_ecosystem.R
